name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Umožňuje ruční spuštění z GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení prostředí Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Instalace nástroje Trunk
        run: cargo install trunk --locked

      - name: Sestavení webové aplikace
        run: |
          cd apps/wordcraft-web
          trunk build --release --public-url /mywordcraft/
          
      - name: Publikování na GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web
